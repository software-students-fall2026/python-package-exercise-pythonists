[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termpet-pythonists"
version = "0.1.1"
description = "A playful terminal-pet Python package."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Ray Yang" },
  { name = "Ryan Lin" },
  { name = "Jolie Leong" },
  { name = "Layan Alyas" },
  {name = "Hoang Ngo" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/software-students-fall2026/python-package-exercise-pythonists"